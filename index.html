<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAGMANOT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         تسجيل الدخول
    ========================== -->

    <section id="loginSection" class="auth-container">

        <h1>🎮 MAGMANOT</h1>

        <div id="authBox">

            <h2>تسجيل الدخول / التسجيل</h2>

            <input
                type="email"
                id="email"
                placeholder="البريد الإلكتروني"
            >

            <input
                type="password"
                id="password"
                placeholder="كلمة المرور"
            >

            <div class="auth-buttons">

                <button id="loginButton">
                    دخول
                </button>

                <button
                    id="registerButton"
                    class="green-button"
                >
                    حساب جديد
                </button>

            </div>

        </div>


        <!-- إكمال الحساب -->

        <div
            id="profileBox"
            style="display:none;"
        >

            <h2>إكمال بيانات الحساب</h2>

            <input
                type="text"
                id="username"
                placeholder="اسم المستخدم"
            >

            <label>
                اختر صورة الحساب:
            </label>

            <input
                type="file"
                id="avatar"
                accept="image/*"
            >

            <button id="saveProfileButton">
                دخول للموقع
            </button>

        </div>

    </section>



    <!-- =========================
         التطبيق
    ========================== -->

    <div
        class="app"
        id="appSection"
        style="display:none;"
    >

        <!-- السيرفرات -->

        <aside class="servers">

            <button
                id="addServer"
                title="إنشاء سيرفر"
            >
                +
            </button>

            <div id="serverList"></div>

        </aside>



        <!-- الدردشة -->

        <main class="chat">

            <header id="channelTitle">

                <span>
                    # عام
                </span>

                <!-- زر الإعدادات -->

                <button
                    id="settingsButton"
                    title="إعدادات الحساب"
                >
                    ⚙️
                </button>

            </header>



            <!-- الرسائل -->

            <div
                class="messages"
                id="messagesBox"
            >

                <div class="message">

                    <b>
                        Admin
                    </b>

                    <p>
                        مرحباً بكم في MAGMANOT! 🎮
                    </p>

                </div>

            </div>



            <!-- إرسال الرسائل -->

            <div class="input-area">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="اكتب رسالة..."
                >

                <button id="sendMessageBtn">
                    إرسال
                </button>

            </div>

        </main>

    </div>



    <!-- =========================
         نافذة الأصدقاء والرسائل الخاصة
    ========================== -->

    <div id="friendsModal" class="modal" style="display:none;">
        <div class="modal-content friends-content">
            <h2>👥 الأصدقاء</h2>
            <div class="add-friend-row">
                <input type="text" id="friendUsernameInput" placeholder="اسم المستخدم لإضافته">
                <button id="addFriendButton">إضافة</button>
            </div>
            <div id="friendsList" class="friends-list"></div>
            <button id="closeFriendsButton" class="red-button">إغلاق</button>
        </div>
    </div>

    <!-- =========================
         نافذة الرسائل الخاصة
    ========================== -->

    <div id="dmModal" class="modal" style="display:none;">
        <div class="modal-content dm-content">
            <div class="dm-header">
                <h2 id="dmTitle">💬 رسالة خاصة</h2>
                <button id="closeDmButton" class="red-button">إغلاق</button>
            </div>
            <div id="dmMessages" class="dm-messages"></div>
            <div class="input-area dm-input-area">
                <input type="text" id="dmInput" placeholder="اكتب رسالة خاصة...">
                <button id="sendDmButton">إرسال</button>
            </div>
        </div>
    </div>

    <!-- =========================
         نافذة إعدادات الحساب
    ========================== -->

    <div
        id="settingsModal"
        class="modal"
        style="display:none;"
    >

        <div class="modal-content">

            <h2>
                ⚙️ إعدادات الحساب
            </h2>


            <label>
                اسم المستخدم
            </label>

            <input
                type="text"
                id="settingsUsername"
                placeholder="اسم المستخدم"
            >


            <label>
                تغيير صورة الحساب
            </label>

            <input
                type="file"
                id="settingsAvatar"
                accept="image/*"
            >


            <button id="saveSettingsButton">
                💾 حفظ التغييرات
            </button>


            <button
                id="closeSettingsButton"
                class="red-button"
            >
                إغلاق
            </button>

        </div>

    </div>



    <!-- =========================
         إنشاء سيرفر
    ========================== -->

    <div
        id="serverModal"
        class="modal"
        style="display:none;"
    >

        <div class="modal-content">

            <h2>
                إنشاء سيرفر جديد
            </h2>


            <input
                type="text"
                id="serverName"
                placeholder="اسم السيرفر"
            >


            <label>
                صورة السيرفر
            </label>

            <input
                type="file"
                id="serverImage"
                accept="image/*"
            >


            <button id="createServer">
                إنشاء السيرفر
            </button>


            <input
                type="text"
                id="inviteLink"
                placeholder="سيظهر رابط الدعوة هنا"
                readonly
            >


            <button id="copyInvite">
                📋 نسخ رابط الدعوة
            </button>


            <button
                id="closeModal"
                class="red-button"
            >
                إغلاق
            </button>

        </div>

    </div>



    <!-- JavaScript -->

    <script
        type="module"
        src="script.js"
    ></script>

</body>

</html>
